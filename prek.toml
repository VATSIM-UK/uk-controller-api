[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = "^public/fonts/filament/" },
  { id = "end-of-file-fixer", exclude = "^public/fonts/filament/" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "pint", name = "Laravel Pint", entry = "vendor/bin/pint", language = "system", files = "\\.php$", exclude = "^tests/" },
]
