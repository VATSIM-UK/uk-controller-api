version: "3.9"
services:
  # Webserver running PHP-FPM and nginx
  web:
    build:
      context: ./.docker/web
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    working_dir: /var/www
    extra_hosts:
      - "sso.ukcp.devapp:127.0.0.1"
      - "ukcp.devapp:127.0.0.1"
    ports:
      - "80:80"
      - "443:443"
      - "6001:6001"
    volumes:
      - type: bind
        source: .
        target: /var/www/ukcp
      - ./.docker/web/sso:/var/www/sso
      - ./.docker/web/etc/nginx/conf.d:/etc/nginx/conf.d
      - ./.docker/web/mysql-client:/etc/mysql/conf.d/
      # Keep dependencies and token/config off the bind mount so they persist
      # across rebuilds and stay owned by the container user.
      - vendor:/var/www/ukcp/vendor
      - node_modules:/var/www/ukcp/node_modules
      - gh-config:/home/www/.config/gh
      - composer-cache:/home/www/.cache/composer
      - yarn-cache:/home/www/.cache/yarn
      - npm-cache:/home/www/.npm
      # SSH: forward the host agent and expose host keys read-only.
      - ${HOME}/.ssh:/home/www/.ssh:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent:ro
    environment:
      SSH_AUTH_SOCK: /ssh-agent
      COMPOSER_CACHE_DIR: /home/www/.cache/composer
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ukcp-network

  # Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./.docker/mysql/etc/mysql/my.cnf:/etc/mysql/conf.d/config-file.cnf
    environment:
      MYSQL_DATABASE: uk_plugin
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ukcp-network

  # Database for test suite
  mysql-test:
    image: mysql:8.0
    container_name: mysql-test
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3360:3360"
    volumes:
      - mysqltestdata:/var/lib/mysql
      - ./.docker/mysql/etc/mysql/my.cnf:/etc/mysql/conf.d/config-file.cnf
    environment:
      MYSQL_DATABASE: uk_plugin
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
      MYSQL_TCP_PORT: 3360
    networks:
      - ukcp-network

  # Redis
  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - ./.docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - ukcp-network

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - ukcp-network
    environment:
      ADMINER_DEFAULT_SERVER: mysql

# Netwokring
networks:
  ukcp-network:
    driver: bridge

#Volumes
volumes:
  mysqldata:
    driver: local
  mysqltestdata:
    driver: local
  gh-config:
    driver: local
  vendor:
    driver: local
  node_modules:
    driver: local
  composer-cache:
    driver: local
  yarn-cache:
    driver: local
  npm-cache:
    driver: local
