name: Open Code Review

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr_job:
    if: github.event.label.name == 'review'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Open Code Review Action
        uses: alibaba/open-code-review@20db3d7d120ebba3d546ddca3459693ce3e1ae86
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_url: "https://opencode.ai/zen/go/v1"
          llm_auth_token: ${{ secrets.OPENCODE_API_KEY }}
          llm_model: "deepseek-v4-pro"
          llm_use_anthropic: "false"
          llm_extra_body: '{"thinking": {"type": "enabled"}, "reasoning_effort": "high"}'
          background: "Ignore all code-style, formatting, or indentation issues (Laravel Pint will catch these)."

      - name: Remove review label
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'review'
            });
